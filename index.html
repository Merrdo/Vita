<style>
/* yatay yönlendirme uyarısı: yalnızca dikey duruşta görünür */
#rot{position:fixed;inset:0;z-index:99;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#f4f2ee;font-family:-apple-system,"SF Pro Display","Helvetica Neue",Inter,system-ui,sans-serif;touch-action:none}
#rot svg{width:64px;height:64px;animation:rt 2.8s ease-in-out infinite}
#dvt{position:absolute;left:0;right:0;bottom:12px;padding:12px 0;font-size:10px;letter-spacing:.22em;text-indent:.22em;text-transform:uppercase;color:rgba(244,242,238,.36);cursor:pointer}
#dvt:active{color:#f4f2ee}
#rot b{margin-top:26px;font-size:13px;font-weight:400;letter-spacing:.18em;opacity:.7}

</style>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>

html,body{height:100%;margin:0;background:#050609;color:var(--fg);font-family:-apple-system,"SF Pro Display","Helvetica Neue",Inter,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

#ttl b{display:block;font-size:12px;font-weight:300;letter-spacing:.42em;text-indent:.42em;opacity:.7}
#ttl i{display:block;margin-top:9px;font-style:normal;font-size:11px;font-weight:300;letter-spacing:.24em;text-indent:.24em;color:var(--dim)}
.row{position:fixed;left:8px;top:18px;display:flex;flex-direction:column;align-items:flex-start;transition:opacity .8s}
.bt{padding:14px 18px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);cursor:pointer;transition:color .2s}
.bt:active,.bt.on{color:var(--fg)}
#start{position:fixed;inset:0;z-index:5;background:#050609;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 26px;transition:opacity .9s}
#start.off{opacity:0;pointer-events:none}
#pause{position:fixed;inset:0;z-index:6;background:rgba(5,6,9,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
#pause.on{opacity:1;pointer-events:auto}
#pause h2{margin:0;font-size:clamp(30px,8vmin,54px);font-weight:100;letter-spacing:.3em;text-indent:.3em}
#pause b{margin-top:30px;font-size:13px;font-weight:400;letter-spacing:.18em;animation:br 2.4s ease-in-out infinite}
#start h1{margin:0;font-size:clamp(46px,13vmin,80px);font-weight:100;letter-spacing:.08em}
#start p{margin:16px 0 0;font-size:15px;line-height:1.7;color:var(--dim);max-width:320px}
#start b{margin-top:34px;font-size:13px;font-weight:400;letter-spacing:.18em;animation:br 2.4s ease-in-out infinite}
@keyframes br{0%,100%{opacity:.3}50%{opacity:.95}}
</style>
</head>

/* yatay kilit (destekleyen tarayıcılarda) + service worker */
(function(){
  function lock(){try{var o=screen.orientation;if(o&&o.lock)o.lock('landscape').catch(function(){})}catch(e){}}
  window.addEventListener('pointerdown',lock,{once:true});
  var dv=document.getElementById('dvt');
  if(dv){
    dv.textContent='Geliştirici: '+(window.ZDEV?'açık':'kapalı');
    dv.addEventListener('pointerdown',function(e){e.stopPropagation()});
    dv.addEventListener('pointerup',function(e){e.stopPropagation();try{localStorage.setItem('vita_dev',window.ZDEV?'0':'1')}catch(_){}location.reload()});
  }
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
