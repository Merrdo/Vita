<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Vita</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vita">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{color-scheme:dark;background:#000}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:none}
#rot{display:none;position:fixed;inset:0;background:#000;color:rgba(244,242,238,.82);font:200 24px/1.4 "SF Pro Display",-apple-system,"Helvetica Neue",system-ui,sans-serif;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:5}
@media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rot">Telefonu yan çevir.</div>
<script>
(()=>{
const TS=32,COLS=76,ROWS=44,WW=COLS*TS,WH=ROWS*TS,FG='244,242,238',TOTAL=10,VR=400,NR=640;
const FONT='"SF Pro Display",-apple-system,"Helvetica Neue",system-ui,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
const mk=(w,h)=>{const e=document.createElement('canvas');e.width=w;e.height=h;return e};
let W,H,dpr,zoom,fog=mk(2,2),fx=fog.getContext('2d');
let q=1;const FQ=.5;
function rs(){dpr=Math.min(devicePixelRatio||1,2)*q;W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);fog.width=Math.round(W*dpr*FQ);fog.height=Math.round(H*dpr*FQ);zoom=Math.max(.75,H/520)}
addEventListener('resize',rs);rs();

/* ---------- rastgele kat üretimi ---------- */
let sd=1;const rnd=()=>{sd|=0;sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rint=(a,b)=>a+Math.floor(rnd()*(b-a+1));
// 0 duvar, 1 zemin, 2 masa, 3 saksı, 4 kolon
let grid,tint,corr,rooms,start,exit,segs=[],floorNo=0;
const idx=(x,y)=>y*COLS+x, inb=(x,y)=>x>=0&&y>=0&&x<COLS&&y<ROWS;
const blockMove=(x,y)=>!inb(x,y)||grid[idx(x,y)]!==1;
const blockSight=(x,y)=>!inb(x,y)||grid[idx(x,y)]===0||grid[idx(x,y)]===4;
function bfs(sx,sy){const d=new Int32Array(COLS*ROWS).fill(-1),q=[idx(sx,sy)];d[q[0]]=0;
 for(let h=0;h<q.length;h++){const c=q[h],x=c%COLS,y=(c/COLS)|0;
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(inb(nx,ny)&&grid[idx(nx,ny)]!==0&&grid[idx(nx,ny)]!==4&&d[idx(nx,ny)]<0){d[idx(nx,ny)]=d[c]+1;q.push(idx(nx,ny))}}}
 return d}
function generate(f){
 sd=(Math.random()*4e9)|0;
 grid=new Uint8Array(COLS*ROWS);tint=new Float32Array(COLS*ROWS);corr=new Uint8Array(COLS*ROWS);rooms=[];
 const minLeaf=Math.max(10,16-Math.floor(f*.7)),cw=rnd()<.5?2:3;
 const carve=(x,y,w,h,c,t)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(i>0&&j>0&&i<COLS-1&&j<ROWS-1){grid[idx(i,j)]=1;if(c)corr[idx(i,j)]=1;if(t)tint[idx(i,j)]=t}};
 const connect=(a,b)=>{const x1=a.cx,y1=a.cy,x2=b.cx,y2=b.cy;carve(Math.min(x1,x2),y1,Math.abs(x2-x1)+cw,cw,1);carve(x2,Math.min(y1,y2),cw,Math.abs(y2-y1)+cw,1)};
 function split(x,y,w,h,d){
  if((w<minLeaf*2&&h<minLeaf*2)||d>=6||(d>=2&&rnd()<.1)){
   const rw=rint(Math.max(5,Math.floor(w*.6)),w-2),rh=rint(Math.max(5,Math.floor(h*.6)),h-2),rx=rint(x+1,x+w-rw-1),ry=rint(y+1,y+h-rh-1);
   const r={x:rx,y:ry,w:rw,h:rh,cx:rx+(rw>>1),cy:ry+(rh>>1)};carve(rx,ry,rw,rh,0,.022+rnd()*.03);rooms.push(r);return r}
  const vert=w<minLeaf*2?false:h<minLeaf*2?true:rnd()<w/(w+h);let a,b;
  if(vert){const s=rint(minLeaf,w-minLeaf);a=split(x,y,s,h,d+1);b=split(x+s,y,w-s,h,d+1)}
  else{const s=rint(minLeaf,h-minLeaf);a=split(x,y,w,s,d+1);b=split(x,y+s,w,h-s,d+1)}
  connect(a,b);return rnd()<.5?a:b}
 split(1,1,COLS-2,ROWS-2,0);
 for(let k=0;k<2+Math.floor(f/3);k++){const a=rooms[rint(0,rooms.length-1)],b=rooms[rint(0,rooms.length-1)];if(a!==b&&Math.hypot(a.cx-b.cx,a.cy-b.cy)<32)connect(a,b)}
 start=rooms[rint(0,rooms.length-1)];
 const d=bfs(start.cx,start.cy);let best=start;rooms.forEach(r=>{if(d[idx(r.cx,r.cy)]>d[idx(best.cx,best.cy)])best=r});exit=best;
 // mobilya
 const ok=(x,y)=>{for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const k=idx(x+i,y+j);if(grid[k]!==1||corr[k])return false}return true};
 rooms.forEach(r=>{if(r===start||r===exit)return;const m=rint(0,4);
  if(m===1)for(let y=r.y+2;y<r.y+r.h-2;y+=3)for(let x=r.x+2;x<r.x+r.w-3;x+=4){if(ok(x,y)&&ok(x+1,y)){grid[idx(x,y)]=2;grid[idx(x+1,y)]=2}}
  if(m===2&&r.w>=8)for(let y=r.y+2;y<r.y+r.h-2;y+=4)for(let x=r.x+2;x<r.x+r.w-2;x+=4)if(ok(x,y))grid[idx(x,y)]=4;
  if(m===3)[[r.x+1,r.y+1],[r.x+r.w-2,r.y+1],[r.x+1,r.y+r.h-2],[r.x+r.w-2,r.y+r.h-2]].forEach(([x,y])=>{if(ok(x,y))grid[idx(x,y)]=3});
  if(m===4&&r.w>=7&&r.h>=6){const c=[[-1,0],[0,0],[1,0],[-1,1],[0,1],[1,1]].map(([i,j])=>[r.cx+i,r.cy+j]);if(c.every(([x,y])=>ok(x,y)))c.forEach(([x,y])=>grid[idx(x,y)]=2)}});
 [start,exit].forEach(r=>{for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)grid[idx(r.cx+i,r.cy+j)]=1});
 const d2=bfs(start.cx,start.cy);
 if(d2[idx(exit.cx,exit.cy)]<0)for(let i=0;i<grid.length;i++)if(grid[i]>1)grid[i]=1;
 buildSegs();buildGround();mc.setTransform(1,0,0,1,0,0);mc.clearRect(0,0,mem.width,mem.height);dirty=true;
 P.x=(start.cx+.5)*TS;P.y=(start.cy+.5)*TS;
}

/* ---------- çizim katmanları ---------- */
const ground=mk(WW,WH),g=ground.getContext('2d'),mem=mk(WW/4,WH/4),mc=mem.getContext('2d'),mini=mk(152,88),mn=mini.getContext('2d'),miniBase=mk(152,88);
function buildGround(){
 g.fillStyle='#000';g.fillRect(0,0,WW,WH);
 const isF=(x,y)=>inb(x,y)&&grid[idx(x,y)]!==0&&grid[idx(x,y)]!==4;
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const t=grid[idx(x,y)],px=x*TS,py=y*TS;
  if(t!==0&&t!==4){const a=tint[idx(x,y)]||.016,v=Math.round(4+240*a);g.fillStyle=`rgb(${v},${v},${v-1})`;g.fillRect(px,py,TS,TS)}
  else if(t===4){g.fillStyle=`rgba(${FG},.07)`;g.fillRect(px,py,TS,TS)}}
 g.lineWidth=1.5;g.strokeStyle=`rgba(${FG},.45)`;g.fillStyle=`rgba(${FG},.05)`;
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const t=grid[idx(x,y)];
  if(t===2){g.beginPath();g.roundRect(x*TS+3,y*TS+4,TS-6,TS-8,4);g.fill();g.stroke()}
  if(t===3){g.beginPath();g.arc(x*TS+TS/2,y*TS+TS/2,10,0,7);g.fill();g.stroke();g.beginPath();g.arc(x*TS+TS/2,y*TS+TS/2,4,0,7);g.stroke()}}
 g.strokeStyle='#e6e4e0';g.lineWidth=3;g.lineCap='square';g.lineJoin='miter';
 segs.forEach(q=>{g.beginPath();g.moveTo(q[0],q[1]);g.lineTo(q[2],q[3]);g.stroke()});g.lineCap='butt';
 // giriş ve çıkış işaretleri
 const mark=(r,ring)=>{const x=(r.cx+.5)*TS,y=(r.cy+.5)*TS;g.strokeStyle=`rgba(${FG},.8)`;g.lineWidth=1.5;
  if(ring){g.beginPath();g.arc(x,y,22,0,7);g.stroke();g.beginPath();g.arc(x,y,4,0,7);g.fillStyle=`rgb(${FG})`;g.fill()}
  else[44,32,20].forEach((s,i)=>{g.globalAlpha=1-i*.25;g.beginPath();g.roundRect(x-s/2*1.1,y-s/2*1.1,s*1.1,s*1.1,5);g.stroke()});
  g.globalAlpha=1;g.fillStyle=`rgba(${FG},.5)`;g.font=`300 11px ${FONT}`;g.textAlign='center';if('letterSpacing' in g)g.letterSpacing='5px';g.fillText(ring?'GİRİŞ':'ÇIKIŞ',x+2,y+42)};
 mark(start,1);mark(exit,0);
 const mb=miniBase.getContext('2d');mb.clearRect(0,0,152,88);mb.drawImage(ground,0,0,152,88);
}

/* ---------- oyuncu ve girdi ---------- */
const P={x:0,y:0,r:13,a:0};
const S={L:{id:null,ox:0,oy:0,x:0,y:0},R:{id:null,ox:0,oy:0,x:0,y:0}},SR=60;
const keys={};let mouse=null;
addEventListener('keydown',e=>keys[e.code]=1);addEventListener('keyup',e=>keys[e.code]=0);
cv.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'){mouse=e;return}
 const s=e.clientX<W/2?S.L:S.R;if(s.id!==null)return;
 s.id=e.pointerId;s.ox=s.x=e.clientX;s.oy=s.y=e.clientY;cv.setPointerCapture(e.pointerId);e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){mouse=e;return}
 for(const s of[S.L,S.R])if(s.id===e.pointerId){s.x=e.clientX;s.y=e.clientY}});
const up=e=>{for(const s of[S.L,S.R])if(s.id===e.pointerId)s.id=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
const vec=s=>{const dx=s.x-s.ox,dy=s.y-s.oy,d=Math.hypot(dx,dy),m=Math.min(d,SR);return d<8?[0,0,0]:[dx/d,dy/d,m/SR]};
function resolve(){
 for(let k=0;k<2;k++){const tx=Math.floor(P.x/TS),ty=Math.floor(P.y/TS);
  for(let j=ty-1;j<=ty+1;j++)for(let i=tx-1;i<=tx+1;i++){if(!blockMove(i,j))continue;
   const x=i*TS,y=j*TS,cx=Math.max(x,Math.min(P.x,x+TS)),cy=Math.max(y,Math.min(P.y,y+TS)),dx=P.x-cx,dy=P.y-cy,d=Math.hypot(dx,dy);
   if(d<P.r&&d>0){P.x=cx+dx/d*P.r;P.y=cy+dy/d*P.r}}}}

/* ---------- görüş alanı (kesin görünürlük çokgeni) ---------- */
const pts=new Float32Array(4096),angs=new Float64Array(2048),near=[];let cnt=0,lx=-1e9,ly=-1e9,dirty=true;
function buildSegs(){segs=[];
 for(let y=0;y<=ROWS;y++){let r=null;for(let x=0;x<=COLS;x++){const e=x<COLS&&blockSight(x,y-1)!==blockSight(x,y);
  if(e){if(r===null)r=x}else if(r!==null){segs.push([r*TS,y*TS,x*TS,y*TS]);r=null}}}
 for(let x=0;x<=COLS;x++){let r=null;for(let y=0;y<=ROWS;y++){const e=y<ROWS&&blockSight(x-1,y)!==blockSight(x,y);
  if(e){if(r===null)r=y}else if(r!==null){segs.push([x*TS,r*TS,x*TS,y*TS]);r=null}}}}
function los(){
 if(!dirty&&Math.abs(P.x-lx)<.4&&Math.abs(P.y-ly)<.4)return false;
 lx=P.x;ly=P.y;dirty=false;
 const px=P.x,py=P.y,x0=px-VR,x1=px+VR,y0=py-VR,y1=py+VR;
 near.length=0;near.push([x0,y0,x1,y0],[x1,y0,x1,y1],[x1,y1,x0,y1],[x0,y1,x0,y0]);
 for(const s of segs){if((s[0]<x0&&s[2]<x0)||(s[0]>x1&&s[2]>x1)||(s[1]<y0&&s[3]<y0)||(s[1]>y1&&s[3]>y1))continue;near.push(s)}
 let n=0;
 for(const s of near)for(let k=0;k<4;k+=2){if(n>2040)break;const a=Math.atan2(s[k+1]-py,s[k]-px);angs[n++]=a-1e-4;angs[n++]=a;angs[n++]=a+1e-4}
 angs.subarray(0,n).sort();
 let m=0;
 for(let i=0;i<n;i++){const a=angs[i],dx=Math.cos(a),dy=Math.sin(a);let best=1e9;
  for(let j=0;j<near.length;j++){const s=near[j],sx=s[2]-s[0],sy=s[3]-s[1],den=dx*sy-dy*sx;if(den<1e-9&&den>-1e-9)continue;
   const t=((s[0]-px)*sy-(s[1]-py)*sx)/den;if(t<=0||t>=best)continue;
   const u=((s[0]-px)*dy-(s[1]-py)*dx)/den;if(u>=-1e-6&&u<=1+1e-6)best=t}
  pts[m++]=px+dx*best;pts[m++]=py+dy*best}
 cnt=m>>1;return true}
function poly(c){c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=1;i<cnt;i++)c.lineTo(pts[i*2],pts[i*2+1]);c.closePath()}

/* ---------- döngü ---------- */
let sN=0,sT=0,fps=0,ms=0,bad=0,good=0,lastMini=0;
function stat(r){sN++;sT+=r;if(sT>=500){fps=Math.round(sN*1000/sT);ms=sT/sN;sN=0;sT=0;
 if(fps<45&&q>.55){good=0;if(++bad>=2){q=Math.max(.55,q-.15);rs();bad=0}}
 else if(fps>=57&&q<1){bad=0;if(++good>=8){q=Math.min(1,q+.15);rs();good=0}}else{bad=0;good=0}}}
let last=performance.now(),aimOn=false,phase=0,fade=0,title='',tt=0;
document.addEventListener('visibilitychange',()=>{last=performance.now();sN=0;sT=0});
const label=f=>f===0?'ZEMİN KAT':f===TOTAL-1?'ZİRVE':f+'. KAT';
function nextFloor(){floorNo=floorNo>=TOTAL-1?0:floorNo+1;generate(floorNo);title=label(floorNo)}
function frame(now){
 const raw=now-last,dt=Math.min(.05,raw/1000);last=now;stat(raw);
 if(phase===0){
  let[mx,my,mm]=vec(S.L);
  const kx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),ky=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(kx||ky){const d=Math.hypot(kx,ky);mx=kx/d;my=ky/d;mm=1}
  const sp=210*mm;P.x+=mx*sp*dt;P.y+=my*sp*dt;resolve();
  const[ax,ay,am]=vec(S.R);aimOn=am>.15;
  if(aimOn)P.a=Math.atan2(ay,ax);else if(mouse)P.a=Math.atan2(mouse.clientY-H/2,mouse.clientX-W/2);
  if(Math.hypot(P.x-(exit.cx+.5)*TS,P.y-(exit.cy+.5)*TS)<26){phase=1;title=label(floorNo===TOTAL-1?0:floorNo+1)}
 }else if(phase===1){fade+=dt*2.2;if(fade>=1){fade=1;nextFloor();phase=2;tt=0}}
 else{tt+=dt;if(tt>.7)fade-=dt*1.6;if(fade<=0){fade=0;phase=0}}
 if(los()){mc.setTransform(.25,0,0,.25,0,0);mc.fillStyle='#fff';poly(mc);mc.fill()}
 draw();requestAnimationFrame(frame)}

function draw(){
 const vw=W/zoom,vh=H/zoom,cx=Math.max(0,Math.min(WW-vw,P.x-vw/2)),cy=Math.max(0,Math.min(WH-vh,P.y-vh/2));
 const cam=[zoom*dpr,0,0,zoom*dpr,-cx*zoom*dpr,-cy*zoom*dpr],fcam=cam.map((v,i)=>i===1||i===2?v:v*FQ);
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
 ctx.setTransform(...cam);ctx.drawImage(ground,cx,cy,vw,vh,cx,cy,vw,vh);
 // görüş alanı dışı: karanlık, keşfedilen yerler soluk
 fx.setTransform(1,0,0,1,0,0);fx.globalCompositeOperation='source-over';fx.fillStyle='#000';fx.fillRect(0,0,fog.width,fog.height);
 fx.globalCompositeOperation='destination-out';fx.setTransform(...fcam);
 fx.globalAlpha=.2;fx.drawImage(mem,cx/4,cy/4,vw/4,vh/4,cx,cy,vw,vh);fx.globalAlpha=1;
 const lg=fx.createRadialGradient(P.x,P.y,30,P.x,P.y,VR);lg.addColorStop(0,'rgba(0,0,0,1)');lg.addColorStop(.55,'rgba(0,0,0,.95)');lg.addColorStop(1,'rgba(0,0,0,0)');
 fx.fillStyle=lg;poly(fx);fx.fill();fx.globalCompositeOperation='source-over';
 ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(fog,0,0,fog.width,fog.height,0,0,cv.width,cv.height);
 // oyuncu
 ctx.setTransform(...cam);
 if(aimOn){ctx.save();ctx.translate(P.x,P.y);ctx.rotate(P.a);ctx.strokeStyle=`rgba(${FG},.3)`;ctx.lineWidth=1.5;ctx.setLineDash([4,9]);ctx.beginPath();ctx.moveTo(40,0);ctx.lineTo(220,0);ctx.stroke();ctx.restore()}
 ctx.save();ctx.translate(P.x,P.y);ctx.rotate(P.a);ctx.fillStyle=`rgba(${FG},.6)`;ctx.beginPath();ctx.roundRect(7,-3,26,6,2);ctx.fill();ctx.restore();
 ctx.fillStyle=`rgb(${FG})`;ctx.beginPath();ctx.arc(P.x,P.y,P.r,0,7);ctx.fill();
 ctx.setTransform(dpr,0,0,dpr,0,0);
 // kat bilgisi
 ctx.fillStyle=`rgba(${FG},.95)`;ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.font=`200 44px ${FONT}`;if('letterSpacing' in ctx)ctx.letterSpacing='0px';ctx.fillText(floorNo,26,62);
 ctx.fillStyle=`rgba(${FG},.46)`;ctx.font=`400 11px ${FONT}`;if('letterSpacing' in ctx)ctx.letterSpacing='4px';ctx.fillText(floorNo===0?'ZEMİN':'KAT',28,82);
 // keşfedilen alan haritası
 const mw=152,mh=88,x0=W-mw-24,y0=22;const nw=performance.now();if(nw-lastMini>120){lastMini=nw;mn.globalCompositeOperation='source-over';mn.clearRect(0,0,mw,mh);mn.drawImage(miniBase,0,0);mn.globalCompositeOperation='destination-in';mn.drawImage(mem,0,0,mw,mh)}
 ctx.globalAlpha=.8;ctx.drawImage(mini,x0,y0);ctx.globalAlpha=1;ctx.strokeStyle=`rgba(${FG},.25)`;ctx.lineWidth=1;ctx.strokeRect(x0,y0,mw,mh);
 ctx.fillStyle=`rgb(${FG})`;ctx.beginPath();ctx.arc(x0+P.x/WW*mw,y0+P.y/WH*mh,2.5,0,7);ctx.fill();
 stick(S.L,110,H-100);stick(S.R,W-110,H-100);
 ctx.fillStyle=`rgba(${FG},.5)`;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.font=`400 10px ${FONT}`;if('letterSpacing' in ctx)ctx.letterSpacing='2px';
 ctx.fillText(fps+' FPS   '+ms.toFixed(1)+' MS'+(q<1?'   '+Math.round(q*100)+'%':''),W/2+1,15);
 if(fade>0){ctx.fillStyle=`rgba(0,0,0,${Math.min(1,fade)})`;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=phase===1?fade:Math.min(1,fade*3);ctx.fillStyle=`rgb(${FG})`;ctx.textAlign='center';ctx.font=`200 40px ${FONT}`;if('letterSpacing' in ctx)ctx.letterSpacing='8px';ctx.fillText(title,W/2+4,H/2+12);ctx.globalAlpha=1}
}
function stick(s,dx,dy){
 const on=s.id!==null,bx=on?s.ox:dx,by=on?s.oy:dy;let kx=bx,ky=by;
 if(on){const a=s.x-s.ox,b=s.y-s.oy,d=Math.hypot(a,b),m=Math.min(d,SR);if(d>0){kx=bx+a/d*m;ky=by+b/d*m}}
 ctx.globalAlpha=on?1:.5;ctx.strokeStyle=`rgba(${FG},.4)`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(bx,by,SR+8,0,7);ctx.stroke();
 ctx.fillStyle=`rgba(${FG},${on?.9:.5})`;ctx.beginPath();ctx.arc(kx,ky,22,0,7);ctx.fill();ctx.globalAlpha=1}
generate(0);requestAnimationFrame(frame);
