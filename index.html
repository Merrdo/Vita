    var h=Math.max(ih,sa?scr:0);   // gömülü önizlemede (Claude vb.) pencere yüksekliği; ekran boyu kullanılırsa alt kısım dışarı taşar
    if(land)h=Math.min(h,Math.max(ih,Math.min(sh,sw)));   // yatayda yükseklik kısa kenarı aşamaz (eski dikey değerle taşma olmasın)

  window.addEventListener('load',fh);
  window.addEventListener('resize',fh);
  window.addEventListener('orientationchange',function(){fh();[60,200,450,900,1600].forEach(function(t){setTimeout(fh,t)})});
  try{if(window.visualViewport)visualViewport.addEventListener('resize',fh)}catch(_){}
  try{matchMedia('(orientation:portrait)').addListener(function(){fh();setTimeout(fh,250)})}catch(_){}

</script>
