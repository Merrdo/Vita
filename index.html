   wallL(yön, x, y): yön = n/s/w/e (aplik hangi duvarda). n/s için x duvar boyunca konum (ondalık), y zemin karosunun satırı;
   w/e için x zemin karosunun sütunu, y duvar boyunca konum (ondalık). Işık kaynağı duvar yüzünün .14 karo önündedir.
   fk (titreşim): 0 sabit · 1 patlamalı titreme · 2 bozuk floresan · 3 ölmekte olan lamba */

const wallL=(d,x,y,col,o)=>{const e=.14;return addL('wall',d==='w'?x+e:d==='e'?x+1-e:x,d==='n'?y+e:d==='s'?y+1-e:y,6.4,col,Object.assign({d:d},o||{}))};

const SS=Math.min(3,Math.max(2,Math.ceil(innerHeight/(TS*7.2)*Math.min(devicePixelRatio||1,2)))),sc=document.createElement('canvas');sc.width=W*TS*SS;sc.height=H*TS*SS;const s=sc.getContext('2d');s.scale(SS,SS);

 const bc=[c[0]+v+kk,c[1]+v,c[2]+v-kk];TC[y*W+x]=bc;
 const F=(col,X,Y,A,B)=>{s.fillStyle=col;s.fillRect(X,Y,A,B)},DK=rgbs(bc,.62),HL=mixs(bc,WH,.13);
 F(rgbs(bc,1),px,py,TS,TS);
 const dot=(n,lt)=>{for(let i=0;i<n;i++)F((lt&&hsh(x,y,i+9)>.5)?mixs(bc,WH,.1):rgbs(bc,.72),px+2+(hsh(x,y,i*3+3)*(TS-5)|0),py+2+(hsh(x,y,i*3+4)*(TS-5)|0),1+(hsh(x,y,i+30)>.8?1:0),1)},
 st=(th,a)=>{if(hsh(x,y,7)>th){const rr=7+hsh(x,y,11)*8,rx=px+rr+hsh(x,y,8)*(TS-2*rr),ry=py+rr+hsh(x,y,10)*(TS-2*rr),gr=s.createRadialGradient(rx,ry,0,rx,ry,rr);gr.addColorStop(0,'rgba(0,0,0,'+a+')');gr.addColorStop(1,'rgba(0,0,0,0)');s.fillStyle=gr;s.fillRect(px,py,TS,TS)}};
 if(m==='c'||m==='d'){dot(9,1);st(.86,.26);

 else if(m==='p'){const PH=mixs(bc,[150,190,255],.14);F(PH,px+1,py+1,TS-2,1);F(PH,px+1,py+1,1,TS-2);F(DK,px+1,py+TS-2,TS-2,1);F(DK,px+TS-2,py+1,1,TS-2);
