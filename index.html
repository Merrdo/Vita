    var h=Math.max(ih,sa?scr:0);   // gömülü önizlemede (Claude vb.) pencere yüksekliği; ekran boyu kullanılırsa alt kısım dışarı taşar

$('over').addEventListener('pointerup',function(){if(pDead&&deadT>1.6)restart()});

/* benzetim adımı: uzun karelerde MAXSTEP'ten büyük adım atılmaz (duvardan geçme/takılma riskini azaltır) */
var MAXSTEP=1/40,FPSCAP=0,PERFHUD=!!window.ZDEV,pfFps=60,pfMs=0;
function sim(dt){T+=dt;syncSticks();
  var started=$('start').classList.contains('off'),live=started&&!pDead,kx=live?(keys.d?1:0)-(keys.a?1:0):0,ky=live?(keys.s?1:0)-(keys.w?1:0):0,mx=kx,my=ky,ax=live?((keys.arrowright)?1:0)-((keys.arrowleft)?1:0):0,ay=live?((keys.arrowdown)?1:0)-((keys.arrowup)?1:0):0,mv,sp,f,f2,la,n=0,q,qy,l,k;
  if(live&&JSK.m.id!==null){q=JSK.m.x-JSK.m.ox;qy=JSK.m.y-JSK.m.oy;l=Math.hypot(q,qy);k=Math.min(1,l/JT());if(l>0){mx+=q/l*k;my+=qy/l*k}}
  if(live&&JSK.a.id!==null){q=JSK.a.x-JSK.a.ox;qy=JSK.a.y-JSK.a.oy;l=Math.hypot(q,qy);k=Math.min(1,l/JTA());if(l>0){ax+=q/l*k;ay+=qy/l*k}if(k>=FIRE_ON)JSK.a.fire=1;else if(k<FIRE_OFF)JSK.a.fire=0}
  mv=Math.hypot(mx,my);if(mv>1){mx/=mv;my/=mv;mv=1}if(mv<.12){mx=my=mv=0}
  am=Math.hypot(ax,ay);SNW=!!Wpn.cur().scope;
  /* dürbünlü silah (sniper): kol itilince nişan alınır; parmak çekilince tek atış; kol merkeze dönerse atış iptal olur */
  scoping=live&&!fs&&SNW&&((JSK.a.id!==null&&am>AIM_DZ)||!!keys[' ']);
  firing=live&&!fs&&!SNW&&(!!JSK.a.fire||!!keys[' ']);
  if(am>AIM_DZ)aimT=Math.atan2(ay,ax);else if(mv>.2&&!firing)aimT=Math.atan2(my,mx);   /* sağ joystick yönü verir; ateş ederken yürüyüş bakışı bozmaz */
  /* ---- SİPER: en yakın katı yüzey (duvar, sütun, cam) bulunur; düğme / C ile alınır, duvardan uzağa itince bırakılır ---- */
  var cvf=live&&!fs?coverFind():null,cvr;
  covAv+=((cvf&&!covOn?1:0)-covAv)*Math.min(1,dt*8);
  if(covReq){covReq=0;
    if(covOn){covOn=0;coverSnd(0)}
    else if(cvf&&live&&!fs){covOn=1;covOut=0;covN.x=cvf.x;covN.y=cvf.y;coverSnd(1)}
    else if(live){covNo=1;coverSnd(2)}}
  if(covOn){
    if(!cvf||cvf.d>COVR+.2||fs){covOn=0;coverSnd(0)}
    else{covN.x+=(cvf.x-covN.x)*Math.min(1,dt*10);covN.y+=(cvf.y-covN.y)*Math.min(1,dt*10);cvr=Math.hypot(covN.x,covN.y)||1;covN.x/=cvr;covN.y/=cvr;
      if(mx*covN.x+my*covN.y>.7)covOut+=dt;else covOut=Math.max(0,covOut-dt*2);
      if(covOut>.32){covOn=0;covOut=0;coverSnd(0)}}}
  covA+=((covOn?1:0)-covA)*Math.min(1,dt*(covOn?6:7));if(covA<.002&&!covOn)covA=0;
  covNo=Math.max(0,covNo-dt*2.2);covP=Math.max(0,covP-dt*5);STEPV=1-.62*covA;
  if(covA>.05&&am<=AIM_DZ&&!firing)aimT=Math.atan2(covN.y,covN.x);   /* siperde nişan yoksa sırtı duvarda, yüzü dışarı */
  var dA=wrap(aimT-pa),tmx=TURN*(firing?1.5:scoping?.8:1),wv=Math.max(-tmx,Math.min(tmx,dA*(firing?16:scoping?10:9))),tq;
  pav+=(wv-pav)*Math.min(1,dt*14);tq=pav*dt;if(Math.abs(tq)>Math.abs(dA))tq=dA;pa+=tq;
  snCool=Math.max(0,snCool-dt);snRdy=SNW&&Wpn.ok()&&snCool<=0?1:0;
  if(scoping){snT+=dt;snHeld=1;snDa+=(Math.abs(wrap(aimT-snPrev))/Math.max(dt,.001)-snDa)*Math.min(1,dt*8);
    if(snDa<2.2&&Math.hypot(pl.vx,pl.vy)<1.7)snF=Math.min(1,snF+dt/(.9-.4*covA));else snF=Math.max(0,snF-dt*.7)}
  else{if(snHeld&&JSK.a.id===null&&!keys[' ']&&snT>=SNMIN&&SNW&&live&&!fs&&snRdy)snShoot();snHeld=0;snT=0;snF=Math.max(0,snF-dt*2.5);snDa=0}
  snPrev=aimT;snS+=((scoping?1:0)-snS)*Math.min(1,dt*(scoping?5:7));VR=SIGHT+(SNIGHT-SIGHT)*snS;FVc=FOV-(FOV-SNFOV)*snS;
  sp=firing?3:scoping?SNSLOW:4.4;sp+=(Math.min(sp,COVSPD)-sp)*covA;f=Math.min(1,dt*(mv?13:9));
  if(covA>.01&&cvf){f2=(cvf.d-COVD)*Math.min(1,dt*9)*covA;pl.x-=covN.x*f2;pl.y-=covN.y*f2}
  f=Math.min(1,dt*(mv?13:9));pl.vx+=(mx*sp-pl.vx)*f;pl.vy+=(my*sp-pl.vy)*f;
  pl.x+=pl.vx*dt;pcol();pl.y+=pl.vy*dt;pcol();wph+=Math.hypot(pl.vx,pl.vy)*dt*2.4;if(Math.floor(wph/PI)!==wpl){wpl=Math.floor(wph/PI);if(live&&Math.hypot(pl.vx,pl.vy)>.8)stepSnd(wpl&1?1:-1)}
  if(live&&keys.r){keys.r=0;Wpn.reload()}Wpn.update(dt);
  cool-=dt;if(firing&&Wpn.ok()){while(cool<=0&&n++<3&&Wpn.ok()){shoot();cool+=Wpn.cur().fi}}else if(cool<0)cool=0;
  recoil*=Math.exp(-dt*(SNW?5:13));bloom=Math.max(0,bloom-dt*.15);kick*=Math.exp(-dt*(SNW?4:9));flash=Math.max(0,flash-dt);f=Math.exp(-dt*9);ck.x*=f;ck.y*=f;
  Hero.update(HR,dt,{spd:Math.hypot(pl.vx,pl.vy),ldx:pl.vx*Math.cos(pa)+pl.vy*Math.sin(pa),ldy:-pl.vx*Math.sin(pa)+pl.vy*Math.cos(pa),aim:scoping||am>AIM_DZ||firing,fire:firing&&Wpn.ok(),recoil:recoil,kick:kick,wp:Wpn.cur().id,cov:covA,carry:covOn,cwx:-(covN.x*Math.cos(pa)+covN.y*Math.sin(pa)),cwy:-(-covN.x*Math.sin(pa)+covN.y*Math.cos(pa))});
  upd(dt);bldUpd(dt);combat(dt,started);if((seenT-=dt)<=0){seenT=.05;markSeen()}fadeSeen(dt);
  if(!fs&&g(pl.x|0,pl.y|0)===3&&canExit()){fs=1;floorSnd()}
  la=Math.max(mv*.6,Math.min(1,scoping?Math.max(am,.6):am)*(.8+(SNLEAD-.8)*snS));f=Math.min(1,dt*7);cs.x+=(pl.x+Math.cos(pa)*la-cs.x)*f;cs.y+=(pl.y+Math.sin(pa)*la-cs.y)*f;
  cam.x=cs.x+ck.x+(Math.random()-.5)*(SNW?.1:.03)*recoil;cam.y=cs.y+ck.y+(Math.random()-.5)*(SNW?.1:.03)*recoil;
  if(fs===1){fade+=dt*2.5;if(fade>=1){fl++;gen();setSub();fs=2}}else if(fs===2){fade-=dt*1.6;if(fade<=0){fade=0;fs=0}}
  exitPing(dt)}
/* kare döngüsü: başlangıç ekranı açıkken (üstü opak kaplı) çizim yapılmaz; FPSCAP>0 ise kare hızı o değerle sınırlanır (30 gibi) */
var ERR={n:0,seen:{}};
var FR=0
function oops(w,err){var m=w+': '+((err&&err.message)||err),el=document.getElementById('err');if(ERR.seen[m])return;ERR.seen[m]=1;ERR.n++;
  if(!el){el=document.createElement('pre');el.id='err';el.style.cssText='position:fixed;left:8px;top:22px;right:8px;margin:0;z-index:50;pointer-events:none;font:10px/1.35 ui-monospace,Menlo,monospace;color:#ff8a5c;white-space:pre-wrap;max-height:40%;overflow:hidden';document.body.appendChild(el)}
  el.textContent+=m+(err&&err.stack?' @'+String(err.stack).split('\n')[1]:'')+'\n'}
window.addEventListener('error',function(e){oops('hata',e.error||e.message)});
window.addEventListener('unhandledrejection',function(e){oops('söz',e.reason)});
/* her adım ayrı korunur: ses ya da çizimdeki bir hata döngüyü (ve hareketi) durdurmasın */
function loop(tm){requestAnimationFrame(loop);FR++;
  if(paused||document.documentElement.classList.contains('pt')){last=tm;return}   // dikey duruşta oyun akmaz
  if(FPSCAP&&tm-last<1000/FPSCAP-2)return;
  var dt=Math.min(.1,(tm-last)/1000)||.016,n=Math.ceil(dt/MAXSTEP),i,w0=PERFHUD?performance.now():0;last=tm;fdt=dt;
  try{for(i=0;i<n;i++)sim(dt/n)}catch(e){oops('sim',e)}
  try{A.step(dt)}catch(e){oops('ses',e)}
  try{if($('start').classList.contains('off'))draw()}catch(e){oops('çizim',e)}
  if(PERFHUD){pfFps+=(1/dt-pfFps)*.05;pfMs+=(performance.now()-w0-pfMs)*.05}}
try{gen()}catch(e){oops('kat üretimi',e)}
requestAnimationFrame(loop);
})();
